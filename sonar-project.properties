# Claves del proyecto en SonarQube Cloud
sonar.organization=aordonezi-umg
sonar.projectKey=aordonezi-umg_biblioteca-django
sonar.projectName=Biblioteca Django

# Código del programa: todo, excepto lo que no escribimos nosotros
sonar.sources=.
sonar.exclusions=venv/**,**/migrations/**,**/__pycache__/**,.pytest_cache/**,.scannerwork/**,db.sqlite3,**/tests.py,**/test_*.py

# Pruebas automatizadas (se analizan aparte)
sonar.tests=.
sonar.test.inclusions=**/tests.py,**/test_*.py

# Configuración general
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13