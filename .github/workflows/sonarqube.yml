name: Pruebas y análisis SonarQube

on:
  push:
    branches:
      - desarrollo
  workflow_dispatch:

jobs:
  pruebas-y-analisis:
    name: Pruebas, cobertura y SonarQube
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar clave temporal para las pruebas
        run: |
          echo "DJANGO_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> "$GITHUB_ENV"

      - name: Ejecutar pruebas con cobertura
        run: pytest --cov=. --cov-report=xml --cov-report=term

      - name: Análisis de SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true